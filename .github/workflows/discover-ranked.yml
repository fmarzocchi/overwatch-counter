name: Diagnosi counterwatch

# Strumento manuale: stampa nel log come counterwatch codifica i filtri (Ranked, divisione).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/discover_ranked.py]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/discover_ranked.py
