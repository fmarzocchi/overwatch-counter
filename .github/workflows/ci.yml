name: Collaudo app

# A ogni push e pull request: test dello scraper, della logica e della PWA nel browser
# (Chromium, schermo da telefono). Gli screenshot restano come artifact da guardare.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tests/test_fetch.py
      - run: node --test tests/*.test.js
      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/e2e.mjs tests/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-app
          path: tests/screenshots
