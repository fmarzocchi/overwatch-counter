name: APK Android

# Compila il guscio Android (WebView sull'app di GitHub Pages), lo prova sull'emulatore e pubblica
# APK + screenshot come artifact e nel ramo "apk" (da lì si scarica l'ultima versione).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android.yml]
  # dopo ogni pubblicazione del sito dovuta a un push (non ai giri dei dati ogni 3 ore):
  # l'APK apre il sito, quindi il collaudo sull'emulatore va rifatto sulla versione nuova
  workflow_run:
    workflows: ["Aggiorna dati e pubblica"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila l'APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Abilita KVM (emulatore veloce)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prova sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/test-on-emulator.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-e-screenshot
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-shots/

      - name: Esito del collaudo nel ramo "apk-test" (anche se fallisce)
        if: always()
        run: |
          mkdir -p /tmp/t && cp -r android-shots /tmp/t/ 2>/dev/null || echo "nessuno screenshot" > /tmp/t/vuoto.txt
          cd /tmp/t
          git init -q -b apk-test
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Collaudo APK n. ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-test

      - name: Pubblica l'ultima APK nel ramo "apk"
        run: |
          mkdir -p /tmp/apk && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/OW-Counter.apk
          cp -r android-shots /tmp/apk/screenshot
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "APK n. ${{ github.run_number }} ($(date -u +%Y-%m-%d))"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
