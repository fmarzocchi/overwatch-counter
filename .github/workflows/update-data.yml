name: Aggiorna dati e pubblica

# Ogni 30 minuti un controllo leggero (1 richiesta): se counterwatch ha dati nuovi, o se l'ultimo
# aggiornamento completo ha più di ~3 ore, scarica i dati, li collauda e pubblica app/ su GitHub Pages.
# Dal pulsante "Aggiorna dati" dell'app e a ogni push su main: sempre aggiornamento completo.
# (Il telefono non fa niente di tutto questo: legge solo il data.json pubblicato, quando l'app è aperta.)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # solo per tenere acceso il cron (vedi ultimo passo)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      fetch_code: ${{ steps.fetch.outputs.code }}
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ultimi dati pubblicati (ripiego se counterwatch cambia)
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if curl -fsSL "$site/data.json?t=$(date +%s)" -o prev.json && python3 -c "import json,sys; d=json.load(open('prev.json')); sys.exit(0 if d.get('heroes') else 1)"; then
            echo "ripiego: dati pubblicati"
          else
            cp app/data.json prev.json
            echo "ripiego: data.json del repository"
          fi
          # file delle divisioni pubblicati: riusati se hanno meno di 12 ore (meno richieste al database del sito)
          mkdir -p prev_divisions
          for k in $(python3 -c "import json; print(' '.join(json.load(open('prev.json')).get('divisions', {}).keys()))"); do
            curl -fsSL "$site/divisions/$k.json?t=$(date +%s)" -o "prev_divisions/$k.json" || rm -f "prev_divisions/$k.json"
          done
          echo "divisioni precedenti: $(ls prev_divisions | wc -l)"

      - name: Serve un aggiornamento completo?
        id: check
        run: python3 tools/needs_update.py --prev prev.json --event "${{ github.event_name }}"

      - name: Collaudo dello scraper (pagine salvate)
        if: steps.check.outputs.run == 'true'
        run: python3 tests/test_fetch.py

      - name: Scarica da counterwatch
        if: steps.check.outputs.run == 'true'
        id: fetch
        run: |
          set +e
          force=""
          [ "${{ steps.check.outputs.force_divisions }}" = "true" ] && force="--force-divisions"
          python3 tools/fetch_data.py --prev prev.json --prev-divisions prev_divisions $force
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "::error::Counterwatch non ha dato dati validi: pubblico gli ultimi dati buoni."
            cp prev.json app/data.json
          elif [ "$code" = "2" ]; then
            echo "::warning::Dati parziali: alcune sezioni usano i dati precedenti (vedi 'problems')."
          fi
          exit 0

      - name: Collaudo della logica sui dati nuovi
        if: steps.check.outputs.run == 'true'
        run: node --test tests/*.test.js

      - name: Icone degli eroi
        if: steps.check.outputs.run == 'true'
        run: python3 tools/fetch_icons.py

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.run == 'true'
        with:
          path: app

  # GitHub spegne i cron dopo 60 giorni senza attività nel repository:
  # riattivare il workflow via API azzera il conteggio (una volta al giorno basta).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Tieni acceso l'aggiornamento automatico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable" || true
          fi

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Dati parziali o scraper rotto: pubblicato comunque, ma il job fallisce così arriva la mail.
      - name: Esito dello scraper
        if: needs.build.outputs.fetch_code != '0'
        run: |
          echo "::error::fetch_data.py è uscito con ${{ needs.build.outputs.fetch_code }}: controlla i log del passo 'Scarica da counterwatch'."
          exit 1
