// Guscio Android minimo: una WebView che apre l'app pubblicata su GitHub Pages.
// Grafica, logica e dati arrivano dal sito: una nuova APK serve solo se cambia questo guscio.
plugins {
    id "com.android.application"
}

android {
    namespace "io.github.fmarzocchi.owcounter"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.fmarzocchi.owcounter"
        minSdk 24
        targetSdk 34
        // numero della run di GitHub Actions: ogni APK nuova si installa sopra la precedente
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        // chiave di debug fissa e versionata (niente segreti): così gli aggiornamenti dell'APK
        // si installano sopra la versione precedente senza disinstallare
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
